name: Windows loader diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  debug:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: |
          Copy-Item validation/windows-loader.cpp src/mediaprobe/sandbox-windows.cpp
          cmake -S src/mediaprobe -B build-probe -DCMAKE_BUILD_TYPE=Release
          cmake --build build-probe --config Release --parallel 2
          python src/mediaprobe/test_helper.py build-probe/src/Release/amule-media-probe.exe HelperTests.test_extracts_wav
