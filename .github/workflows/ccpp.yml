name: C/C++ CI

on:
  push:
    branches: [ "**" ]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'unittests/**'
      - 'po/**'
      - 'config.h.cm'
      - 'scripts/check-unique-ids.py'
      - 'scripts/check-tray-backend-build.py'
      - '.github/workflows/ccpp.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'unittests/**'
      - 'po/**'
      - 'config.h.cm'
      - 'scripts/check-unique-ids.py'
      - 'scripts/check-tray-backend-build.py'
      - '.github/workflows/ccpp.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  # cache-save-newest lists the repository's caches and deletes the generations
  # its save replaces.
  actions: write
  pull-requests: write

env:
  ctest_shared_file_reverify: '^SharedFileReverifyIntegrationTest$'
  # Do not count a skipped artwork test as native GUI coverage.
  AMULE_ICON_TEST_REQUIRE_GUI: "1"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

  # The minus sign removes the trailing new line in the last line
  #
  # libayatana-appindicator3-dev is not needed to build aMule, but its
  # presence is what flips WITH_LIBAYATANA_APPINDICATOR on (CMakeLists.txt
  # probes for it with pkg_check_modules). Without it the SNI tray backend
  # in MuleTrayIcon.cpp is #ifdef'd out and never compiled here -- only
  # packaging.yml built it, and that runs after merge, so a break in that
  # half landed on master before anything noticed.
  cmake_ubuntu_deps: |-
    binutils-dev \
    build-essential \
    ccache \
    cmake \
    gettext \
    libayatana-appindicator3-dev \
    libboost-all-dev \
    libcrypto++-dev \
    libgd-dev \
    libglib2.0-dev \
    libgnutls28-dev \
    libmaxminddb-dev \
    libreadline-dev \
    libupnp-dev \
    libwxgtk3.2-dev \
    locales \
    pkg-config \
    po4a \
    xvfb \
    xauth \
    wx3.2-headers

  cmake_macos_deps: |-
    boost \
    ccache \
    cryptopp \
    gd \
    gettext \
    libmaxminddb \
    libupnp \
    pkg-config \
    wxwidgets

  # CLANG64, not MINGW64: wxWidgets 3.3 is not packaged for the latter, and
  # 3.3 is what the system light/dark appearance support needs. This also
  # matches the CLANGARM64 leg the release packaging uses, so CI and the
  # shipped Windows builds share one toolchain.
  cmake_mingw_w64_deps: |
    mingw-w64-clang-x86_64-boost
    mingw-w64-clang-x86_64-ccache
    mingw-w64-clang-x86_64-cmake
    mingw-w64-clang-x86_64-crypto++
    mingw-w64-clang-x86_64-gettext
    mingw-w64-clang-x86_64-libgd
    mingw-w64-clang-x86_64-libmaxminddb
    mingw-w64-clang-x86_64-ngtcp2
    mingw-w64-clang-x86_64-ninja
    mingw-w64-clang-x86_64-pkgconf
    mingw-w64-clang-x86_64-readline
    mingw-w64-clang-x86_64-toolchain
    mingw-w64-clang-x86_64-wxwidgets3.3-msw
    mingw-w64-clang-x86_64-zlib

  cmake_common_config_flags: |-
    -B build \
    -DBUILD_ALC=YES \
    -DBUILD_ALCC=YES \
    -DBUILD_AMULECMD=YES \
    -DBUILD_AMULEAPI=YES \
    -DBUILD_CAS=YES \
    -DBUILD_DAEMON=YES \
    -DBUILD_WXCAS=YES \
    -DBUILD_ED2K=YES \
    -DBUILD_MONOLITHIC=YES \
    -DBUILD_REMOTEGUI=YES \
    -DBUILD_TESTING=YES \
    -DENABLE_INTEGRATION_TESTS=YES \
    -DBUILD_WEBSERVER=YES \
    -DENABLE_NLS=YES \
    -DENABLE_UPNP=YES

  cmake_ubuntu_config_flags: |-
    -DENABLE_IP2COUNTRY=YES

  # ENABLE_NLS will be auto-disabled by cmake/nls.cmake: argz.h is
  #   a glibc-only header and isn't provided by macOS or Homebrew
  cmake_macos_config_flags: |-
    -DENABLE_IP2COUNTRY=YES

  cmake_mingw_w64_config_flags: |-
    -G Ninja \
    -DENABLE_IP2COUNTRY=YES

  ctest_flags: |-
    --test-dir build \
    --output-on-failure
  # CredentialsTest and AmuleApiConfigTest run the production 210,000-iteration PBKDF2.
  # IntegrationFixtureUnitTest also needs room for Python startup and temporary-file I/O
  # on Windows runners. UnicodeCommandLineIntegrationTest launches three daemon processes,
  # each with a 15 s watchdog. AmuleApiPasswordInputTest exercises setup and native
  # terminal input without a daemon. ConnectorConfigPathTest launches multiple offline clients.
  # Give these tests 60 s; fast unit tests keep their 10 s budget.
  # Keep the budgets here rather than in TIMEOUT properties, which would also cap distro
  # builds that run ctest with no limit.
  ctest_slow_unit_tests: '^(CredentialsTest|AmuleApiConfigTest|IntegrationFixtureUnitTest|UnicodeCommandLineIntegrationTest|AmuleApiPasswordInputTest|ConnectorConfigPathTest-(amulecmd|amuleweb))$'
  # Integration tests start and restart real processes. Run them separately
  # on Ubuntu outside the fast unit-test time budget, with 300 s each so a hung daemon
  # still fails the job. AllSearchIntegrationTest takes about 15 s on the runners.
  ctest_fast_exclude: '^(NetworkPreferencesIntegrationTest|ConnectorConfigPathTest-(amulecmd|amuleweb)|AmuleApiPasswordInputTest|AmuleApiEcPasswordIntegrationTest|CredentialsTest|AmuleApiConfigTest|IntegrationFixtureUnitTest|UnicodeCommandLineIntegrationTest|AmuleApiRestartIntegrationTest|AllSearchIntegrationTest|AllSearchClientCapabilityTest|ChatCaptchaIntegrationTest|PathDefaultsIntegrationTest|LogfilePathIntegrationTest|KadIndexLifecycleECTest|ShareWatcherMoveIntegrationTest|DisplayRatesIntegrationTest|DownloadDisplayRatesIntegrationTest|UploadRefillIntegrationTest|UploadRefillCompressedIntegrationTest|KnownHistoryIntegrationTest|ServerListSourcesIntegrationTest|ServerListGuiIntegrationTest|ServerListFallbackIntegrationTest|ServerListFallbackApiIntegrationTest|KadDistributionECTest|KadPopulatedDistributionECTest|KadLookupECTest|KadPopulatedLookupECTest|CompletedFileDeleteIntegrationTest|CompletedFileDeleteCapabilityTest|SharedMembershipIntegrationTest)$'

jobs:
  build_cmake_windows_mingw_w64:
    name: Build CMake mingw-w64 (${{ matrix.build_type }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        # ENABLE_UTP on one leg only. The vendored libutp compiles
        # libutp_inet_ntop.cpp under if(WIN32), and both jobs that set
        # ENABLE_ALL_EXPERIMENTAL run on ubuntu-latest, so that source was
        # built by nothing: a pin bump or an MSYS2 toolchain shift would break
        # Windows silently and be found by whoever first turned the switch on
        # there. One leg is enough to compile it, and keeps the cost of a
        # snapshot that does not build on Windows to a single job.
        #
        # ENABLE_QUIC rides on the same leg for the same reason: nothing else
        # builds the QUIC sources and their tests on Windows. ngtcp2 comes from
        # MSYS2 here, not from the source build pinned for the Linux jobs. Both
        # legs install it, so they share one package list.
        include:
          - build_type: Debug
            extra_config_flags: -DENABLE_UTP=YES -DENABLE_QUIC=YES
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - name: restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ runner.os }}-${{ matrix.build_type }}-ccache-
      - name: set up MSYS2 mingw-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          # The action's package cache saves on every event, with no way to limit
          # it to master, and spares only the 10-20 s the ~400 MB download takes.
          cache: false
      - name: install mingw-w64 dependencies
        id: windows-deps
        run: |
          set -euo pipefail
          mapfile -t packages < <(printf '%s' "$cmake_mingw_w64_deps")
          # Mirrors can rate-limit this large transaction. Keep downloaded
          # packages and retry after a delay instead of aborting on HTTP 429.
          for attempt in 1 2 3; do
            if pacman --noconfirm -S --needed --overwrite '*' "${packages[@]}"; then
              exit 0
            fi
            if (( attempt == 3 )); then
              echo '::error::MSYS2 dependency installation failed after 3 attempts.'
              exit 1
            fi
            delay=$((attempt * 30))
            echo "::warning::MSYS2 dependency installation failed; retrying in ${delay}s."
            sleep "$delay"
          done
      # MSYS2 only packages pupnp 1.14.x; build the pinned 22.x from source so
      # Windows gets the UPnP fixes released in 22.0.4 (issue #242). Installed
      # into $MINGW_PREFIX so find_package(UPNP CONFIG) picks it up and the DLL
      # bundles into the portable.
      - name: build libupnp (pupnp) from source
        run: |
          set -euo pipefail
          . packaging/linux/versions.env
          curl -L -o /tmp/libupnp.tar.gz "$LIBUPNP_TARBALL_URL"
          echo "$LIBUPNP_SHA256  /tmp/libupnp.tar.gz" | sha256sum -c -
          mkdir -p /tmp/libupnp
          tar -xf /tmp/libupnp.tar.gz -C /tmp/libupnp --strip-components=1
          cmake -S /tmp/libupnp -B /tmp/libupnp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DUPNP_BUILD_SHARED=ON -DUPNP_BUILD_STATIC=OFF \
            -DUPNP_BUILD_SAMPLES=OFF -DUPNP_BUILD_TESTS=OFF -Dreuseaddr=ON -Dipv6=ON \
            -DCMAKE_INSTALL_PREFIX="$MINGW_PREFIX"
          cmake --build /tmp/libupnp/build
          cmake --install /tmp/libupnp/build
      - name: create build system
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ env.cmake_common_config_flags }} \
            ${{ env.cmake_mingw_w64_config_flags }} \
            ${{ matrix.extra_config_flags }}
      - name: zero ccache stats
        run: ccache --zero-stats
      - name: make
        run: cmake --build build --target TextClearButtonTest
      - name: save ccache
        uses: ./.github/actions/cache-save-newest
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.build_type }}-ccache-${{ github.run_id }}
      - name: ccache stats
        if: always() && steps.windows-deps.outcome == 'success'
        run: ccache --show-stats
      - name: run tests
        run: ctest ${{ env.ctest_flags }} --timeout 10 -R '^TextClearButtonTest$' --repeat until-fail:50
      # The test binary is needed to symbolize the dump.
      - uses: actions/upload-artifact@v7
        if: failure() && hashFiles('build/hang-dumps/*.dmp') != ''
        with:
          name: icon-artwork-hang-${{ matrix.build_type }}
          path: |
            build/hang-dumps/
            build/unittests/tests/IconArtworkTest.exe
          retention-days: 14
