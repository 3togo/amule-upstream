name: WebUI unit tests

on:
  push:
    paths:
      - 'src/webapi/static/js/**'
      - 'unittests/browser-tests/*.test.mjs'
      - '.github/workflows/webui.yml'
  pull_request:
    paths:
      - 'src/webapi/static/js/**'
      - 'unittests/browser-tests/*.test.mjs'
      - '.github/workflows/webui.yml'

permissions:
  contents: read

jobs:
  test:
    name: WebUI unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test unittests/browser-tests/*.test.mjs
